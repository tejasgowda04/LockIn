<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1318">
  <meta name="description" content="LockIn – Modern trading journal with automated statistics, risk calculation, calendar tracking, and prop firm metrics.">

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Early Theme Detection: Prevents theme flicker on page load -->
  <script>
    try {
      var t0 = localStorage.getItem("ascend1t");
      document.documentElement.setAttribute(
        "data-theme",
        t0 || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      );
    } catch (e) {}
  </script>

  <title>LockIn – Trading Journal</title>

  <!-- Typography: Sora (Headings), Manrope (Body), JetBrains Mono (Financial Numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- QR Code Generator (Primary & CDN Fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    window.qrcode || document.write('<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"><\/script>');
  </script>

  <!-- Firebase Authentication SDKs (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Supabase Client SDK (v2 for PostgreSQL & Storage) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Ambient Aurora Glow Effects -->
  <div class="aur"><i></i><i></i><i></i></div>

  <!-- Top Header Bar -->
  <header class="top">
    <img class="lg lgi" alt="LockIn Logo">
    <div>
      <b>Lock<em>In</em></b>
      <small id="tg">Log it. Learn it. Level up.</small>
    </div>
    <input
      class="gs"
      id="gs"
      type="search"
      placeholder="Search trades, notes…"
      aria-label="Search trades"
      oninput="q=this.value;if(tab!=='trades')go('trades');else $('#trl').innerHTML=trList()"
    >
    <button class="tsw" id="thm" onclick="toggleTheme()" aria-label="Switch theme">
      <i>🌙</i>
    </button>
    <button class="av" id="av" onclick="go('me')" aria-label="Profile">T</button>
  </header>

  <!-- Main View Container: Renders tabs (home, trades, cal, jrn, prop, risk, me) -->
  <main id="app"></main>

  <!-- Bottom / Sidebar Navigation -->
  <nav id="nav"></nav>

  <!-- Global Toast Notification Banner -->
  <div id="toast" role="status"></div>

  <!-- Application Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
